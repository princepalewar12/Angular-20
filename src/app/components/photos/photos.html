<div class="row w-100 mt-3 p-4">
  <div class="row">
    <div class="col-12">
      <h4>Totol Count: <span>{{photosInfo?.length}}</span></h4>
    </div>
  </div>
  <div class="col-7">
    <div class="card-header bg-info">
      Photos List
    </div>
    <div class="card-body">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Id</th>
            <th>Title</th>
            <th>Url</th>
            <th>Thumbnail Url</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (item of photosInfo; track $index) {

          <tr>
            <td>{{item?.id}}</td>
            <td>{{item?.title}}</td>
            <td>{{item?.thumbnailUrl}}</td>
            <td>{{item?.url}}</td>
            <td>
              <button class="btn btn-sm btn-success" (click)="editPhotoData(item)">Edit</button>
              <button class="btn btn-sm btn-dark">Delete</button>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
  <div class="col-5">
    <div class="card">
      <div class="card-header bg-info">
        Photos Details
      </div>
      <div class="card-body">
        <form class="form">
          <div class="row">
            <div class="col-6">
              <label for="title">Id</label>
              <input type="text" id="title" [(ngModel)]="payload.id" class="form-control" name="id">
            </div>
            <div class="col-6">
              <label for="title">Title</label>
              <input type="text" id="title" [(ngModel)]="payload.title" class="form-control" name="title">
            </div>
            <div class="col-6">
              <label for="title">Url</label>
              <input type="text" id="title" [(ngModel)]="payload.url" class="form-control" name="url">
            </div>
            <div class="col-6">
              <label for="title">Thumbnail Url</label>
              <input type="text" id="title" [(ngModel)]="payload.thumbnailUrl" class="form-control" name="thumbnailUrl">
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-6 text-center">
              <button (click)="setPhotoData()" type="submit" class="btn btn-primary">Reset</button>

            </div>
            <div class="col-6 text-center">
              <button type="submit" class="btn btn-secondary">Save</button>

            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
